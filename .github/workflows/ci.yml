name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Swift ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes netcat-openbsd procps

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build native macOS app
        if: runner.os == 'macOS'
        run: |
          xcodebuild \
            -project Cachewatch.xcodeproj \
            -scheme Cachewatch \
            -destination 'platform=macOS,arch=arm64' \
            build
