name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a non-publishing package dry run
        required: true
        default: 0.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Determine release context
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          scripts/release-context.sh \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF_NAME" \
            "$MANUAL_VERSION" >> "$GITHUB_ENV"

      - name: Determine release signing mode
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ "$CACHEWATCH_PUBLISH" != "true" ]]; then
            echo "Dry-run packaging uses ad-hoc signing and does not contact Apple's notary service."
            echo "CACHEWATCH_NOTARIZE_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          configured=0
          missing=0
          for variable_name in \
            DEVELOPER_ID_APPLICATION_P12_BASE64 \
            DEVELOPER_ID_APPLICATION_P12_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [[ -z "${!variable_name:-}" ]]; then
              missing=$((missing + 1))
            else
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "Publishing an ad-hoc signed release; Gatekeeper approval will be required."
            echo "CACHEWATCH_NOTARIZE_RELEASE=false" >> "$GITHUB_ENV"
          elif [[ "$missing" -ne 0 ]]; then
            echo "Apple release secrets are partially configured; set all five or remove all five." >&2
            exit 1
          else
            echo "Publishing a Developer ID signed and notarized release."
            echo "CACHEWATCH_NOTARIZE_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Validate tap credentials
        if: env.CACHEWATCH_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "TAP_GITHUB_TOKEN must have contents and pull-request access to fyzanshaik/homebrew-tap" >&2
            exit 1
          fi
          if [[ "$(gh api repos/fyzanshaik/homebrew-tap --jq '.permissions.push')" != "true" ]]; then
            echo "TAP_GITHUB_TOKEN cannot push to fyzanshaik/homebrew-tap" >&2
            exit 1
          fi

      - name: Verify
        run: |
          scripts/test-release-context.sh
          swift test

      - name: Import Developer ID certificate
        if: env.CACHEWATCH_NOTARIZE_RELEASE == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/cachewatch-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F\" '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "The imported archive has no valid Developer ID Application identity" >&2
            exit 1
          fi
          echo "CACHEWATCH_CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build release packages
        env:
          CACHEWATCH_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/package-release.sh "$CACHEWATCH_RELEASE_TAG" "$RUNNER_TEMP/dist"

      - name: Notarize and staple release packages
        if: env.CACHEWATCH_NOTARIZE_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          version="${CACHEWATCH_RELEASE_TAG#v}"
          scripts/notarize-release.sh \
            "$RUNNER_TEMP/dist/Cachewatch-${version}-macos-arm64.zip"

      - name: Test release packages
        run: |
          verification_args=(
            "$RUNNER_TEMP/dist/Cachewatch-${CACHEWATCH_RELEASE_TAG#v}-macos-arm64.zip"
            "$CACHEWATCH_RELEASE_TAG"
          )
          if [[ "$CACHEWATCH_NOTARIZE_RELEASE" == "true" ]]; then
            verification_args+=(--require-notarization)
          fi
          scripts/test-release-package.sh "${verification_args[@]}"
          (cd "$RUNNER_TEMP/dist" && shasum -a 256 -c SHA256SUMS)

      - name: Publish GitHub release
        if: env.CACHEWATCH_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$CACHEWATCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$CACHEWATCH_RELEASE_TAG" "$RUNNER_TEMP"/dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$CACHEWATCH_RELEASE_TAG" "$RUNNER_TEMP"/dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --verify-tag
          fi

      - name: Render Homebrew cask
        run: |
          version="${CACHEWATCH_RELEASE_TAG#v}"
          app_sha="$(shasum -a 256 "$RUNNER_TEMP/dist/Cachewatch-${version}-macos-arm64.zip" | awk '{print $1}')"
          cli_sha="$(shasum -a 256 "$RUNNER_TEMP/dist/cachewatch-${version}-macos-arm64.tar.gz" | awk '{print $1}')"
          scripts/render-homebrew-cask.sh "$version" "$app_sha" "$RUNNER_TEMP/cachewatch-cask.rb"
          scripts/render-homebrew-formula.sh "$version" "$cli_sha" "$RUNNER_TEMP/cachewatch-formula.rb"

      - name: Open tap update pull request
        if: env.CACHEWATCH_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          version="${CACHEWATCH_RELEASE_TAG#v}"
          branch="cachewatch-${version}"
          gh auth setup-git
          gh repo clone fyzanshaik/homebrew-tap "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          mkdir -p Casks Formula
          cp "$RUNNER_TEMP/cachewatch-cask.rb" Casks/cachewatch.rb
          cp "$RUNNER_TEMP/cachewatch-formula.rb" Formula/cachewatch.rb
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cachewatch.rb Formula/cachewatch.rb
          git commit -m "Update Cachewatch to ${version}"
          git push origin "$branch"
          gh pr create \
            --repo fyzanshaik/homebrew-tap \
            --base main \
            --head "$branch" \
            --title "Update Cachewatch to ${version}" \
            --body "Generated from fyzanshaik/cachewatch ${CACHEWATCH_RELEASE_TAG}."
